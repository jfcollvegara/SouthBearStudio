name: Publicar web en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Crear vídeo de ida y vuelta sin cortes
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          SOURCE="public/southbear-film.mp4"
          OUTPUT="public/southbear-film-pingpong.mp4"
          FRAMES="$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$SOURCE")"
          if ! [[ "$FRAMES" =~ ^[0-9]+$ ]] || [ "$FRAMES" -lt 3 ]; then
            echo "No se pudo leer el número de fotogramas del vídeo."
            exit 1
          fi
          LAST="$((FRAMES - 1))"
          ffmpeg -hide_banner -loglevel error -y -i "$SOURCE" \
            -filter_complex "[0:v]split=2[f][r];[f]setpts=PTS-STARTPTS[forward];[r]reverse,trim=start_frame=1:end_frame=${LAST},setpts=PTS-STARTPTS[backward];[forward][backward]concat=n=2:v=1:a=0,format=yuv420p[v]" \
            -map "[v]" -an -c:v libx264 -preset fast -crf 27 \
            -movflags +faststart "$OUTPUT"
          test -s "$OUTPUT"
      - name: Compilar Astro
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
